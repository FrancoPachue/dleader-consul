name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# The token needs nothing but read access to check out the source. The publish job
# widens nothing: it authenticates to NuGet with its own secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Source Link embeds commit information, which needs real history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # One SDK per target framework. The SDKs bring their runtimes, which the
          # multi-targeted test run needs in order to execute on all three.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors via Directory.Build.props, so this gate is real.
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests (net8.0, net9.0, net10.0)
        run: >
          dotnet test DLeader.Consul.Tests/DLeader.Consul.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Integration tests (real Consul via Testcontainers)
        # These are the only tests that can tell us whether the leadership guarantees
        # hold. Docker is available on the GitHub-hosted Ubuntu runners.
        run: >
          dotnet test DLeader.Consul.IntegrationTests/DLeader.Consul.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      - name: Cluster failure tests (three-server Consul, real Raft)
        # A separate project, and therefore a separate run, on purpose. Each of these
        # brings up three Consul servers and waits out real Raft elections; sharing a
        # run with the other suite means a dozen containers competing while elections
        # are timing out, which produced failures that vanished when the tests were run
        # alone. A filter would have expressed the same intent and been forgotten.
        run: >
          dotnet test DLeader.Consul.ClusterTests/DLeader.Consul.ClusterTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=cluster.trx"
          --results-directory artifacts/test-results

      - name: Coverage summary
        # Puts the numbers on the job summary, where someone might actually read them.
        # An artifact nobody opens is not a measurement.
        #
        # Deliberately no threshold gate. This figure covers the unit suite only:
        # instrumenting the integration suite takes it from ~45s to over 15 minutes, and
        # several of those tests assert on elapsed time, so the instrumentation would
        # risk changing what it measures. Most of this library's real coverage comes
        # from those tests, so gating on a number that describes half the testing would
        # be worse than not gating - it would fail honest changes and pass the kind of
        # bug this library actually ships, which lived in an uncovered catch block.
        if: always()
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'artifacts/test-results/**/coverage.cobertura.xml' \
            -targetdir:artifacts/coverage \
            -reporttypes:'MarkdownSummaryGithub;TextSummary'
          {
            echo '> Unit suite only. The integration suite is not instrumented, so real'
            echo '> coverage is higher than this. See the note in ci.yml.'
            echo
            cat artifacts/coverage/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/coverage/Summary.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Pack
        # Two packages since 2.0: messaging was split out of the leadership package.
        run: |
          set -euo pipefail
          for project in DLeader.Consul DLeader.Consul.Messaging; do
            dotnet pack "$project/$project.csproj" \
              --configuration Release \
              --no-build \
              --output artifacts/packages
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/packages
          retention-days: 14

  publish:
    name: Publish to NuGet
    # Nothing reaches NuGet that has not built clean on all three targets and passed
    # both suites. The previous workflow published on a tag with no such gate.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets this job mint an OIDC token, which is what nuget.org exchanges for a
      # short-lived API key. Scoped to this job so the build job cannot request one.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Check the tag matches the project version
        # The tag drove the package version while <Version> said something else
        # entirely, so the two could disagree without anything noticing. This is the
        # only thing standing between a wrong tag and an irreversible push to NuGet,
        # so it uses sed rather than grep -P: PCRE support depends on the locale, and
        # a guard that fails to run on some runners is not a guard.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"

          # Both packages are versioned and released together. Checking only one would
          # let them drift, and a consumer who takes a matched pair from one tag should
          # get a matched pair.
          for project in DLeader.Consul DLeader.Consul.Messaging; do
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project/$project.csproj" | head -1)
            echo "tag=$tag $project=$version"

            if [ -z "$version" ]; then
              echo "::error::Could not read <Version> from $project/$project.csproj"
              exit 1
            fi

            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag does not match <Version>$version</Version> in $project.csproj"
              exit 1
            fi
          done

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts/packages

      - name: Get a short-lived NuGet key (trusted publishing)
        # No long-lived API key. nuget.org validates this job's OIDC token against a
        # trusted publishing policy naming this repository and workflow file, and hands
        # back a key valid for one hour. The previous release failed with a 403 because
        # the stored key had silently expired, which is precisely the failure mode this
        # removes: there is no key to rotate, leak, or forget.
        #
        # The policy lives at nuget.org -> account -> Trusted Publishing, and must name:
        #   Repository owner: FrancoPachue
        #   Repository:       dleader-consul
        #   Workflow file:    ci.yml        (filename only, no .github/workflows/ path)
        #
        # Requested immediately before the push, since the key expires in an hour.
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name, which is not the same as the GitHub username:
          # this account is FrancoPachue on GitHub and FrancoPachu on nuget.org.
          user: FrancoPachu

      - name: Push to NuGet
        # Pushes both packages. No --skip-duplicate: a version that is already published
        # means the version was not bumped, and that should fail loudly rather than pass
        # green having done nothing.
        #
        # The trusted publishing policy must cover both package ids. A policy scoped to
        # the glob "DLeader.Consul" with "push only new package versions" refuses
        # DLeader.Consul.Messaging, which is a new id - widen the glob to
        # "DLeader.Consul*" and allow new packages for the first release of it.
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
